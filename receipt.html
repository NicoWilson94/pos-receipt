<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt</title>
<style id="page-size">@page { size: 58mm 200mm; margin: 0; }</style>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
    line-height: 1.35;
    color: #000;
    background: #eee;
  }
  #receipt {
    width: 48mm;               /* 58mm paper = ~48mm printable */
    margin: 12px auto;
    padding: 3mm 0;
    background: #fff;
  }
  body.w80 #receipt { width: 72mm; font-size: 13px; } /* 80mm paper */
  .center { text-align: center; }
  .bold { font-weight: bold; }
  .big { font-size: 1.25em; }
  .logo { display: block; max-width: 55%; max-height: 24mm; margin: 0 auto 4mm; }
  .store { margin-bottom: 3mm; }
  .item { margin: 2.5mm 0; }
  .item-detail { margin-top: 0.5mm; }
  .date { margin-top: 4mm; }
  hr { border: 0; border-top: 1px solid #555; margin: 2.5mm 0; }
  .row { display: flex; justify-content: space-between; gap: 2mm; }
  .row span:last-child { text-align: right; white-space: nowrap; }
  .item-name { word-break: break-word; }
  .item-detail { padding-left: 2mm; }
  .footer { margin-top: 3mm; white-space: pre-line; }
  .sub { padding-left: 2mm; }
  .sub .row span:first-child { padding-left: 0; }
  .meta { margin: 1mm 0; }
  .note { margin-top: 2.5mm; white-space: pre-line; word-break: break-word; }
  #controls { text-align: center; margin: 12px; }
  #controls button {
    font-size: 16px; padding: 10px 24px; margin: 0 6px;
    border: 0; border-radius: 6px; background: #1a73e8; color: #fff;
  }
  #controls button.secondary { background: #777; }
  #error { color: #b00; text-align: center; margin: 12px; font-family: sans-serif; }
  @media print {
    body { background: #fff; }
    html, body { margin: 0; padding: 0; }
    #receipt { margin: 0 auto; }
    #controls, #error { display: none; }
  }
</style>
</head>
<body>
<div id="controls">
  <button onclick="window.print()">Print</button>
  <button class="secondary" onclick="history.back()">Back</button>
</div>
<div id="error"></div>
<div id="receipt"></div>

<script>
// Save this page on the device so it opens without internet next time
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(function () {});
}
</script>
<script>
/*
  Receipt data is read from the part of the URL after "#".
  Browsers never send that part to the server, so order data stays on the device.

  Parameters (all optional except i):
    s    store name            a    address           p   phone
    logo logo image URL        id   order number      d   date/time text
    c    cashier               t    table / customer  pay payment method
    i    items: "qty|name|price , qty|name|price , ..."  (AppSheet list output)
         v2: "qty|name~detail~detail|unitPrice|lineTotal"
             detail lines are separated by "~";
             a detail "+Topping^18000" prints as an add-on row with its amount on the right;
             lineTotal (optional 4th field) is used as the item's total (incl. add-ons)
    plat platform   ot order type   n note / catatan
    sub  subtotal   disc discount   svc service charge   tax tax/PB1
    tot  total      paid amount paid   chg change
    f    footer text   cur currency prefix (default "Rp")
    w    paper width: 58 (default) or 80
    auto 1 = open print dialog automatically (default), 0 = don't
*/
(function () {
  var q = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  var get = function (k) { return (q.get(k) || "").trim(); };
  var cur = q.has("cur") ? get("cur") : "Rp";

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function toNum(v) {
    // accepts "25000", "25000.5", "25.000" (id) or "25,000.00" (en)
    v = String(v).replace(/[^\d.,-]/g, "");
    if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(v)) v = v.replace(/\./g, "").replace(",", ".");
    else v = v.replace(/,/g, "");
    var n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }
  function money(v) {
    var n = toNum(v);
    return (cur ? cur + " " : "") + n.toLocaleString("id-ID", { maximumFractionDigits: 2 });
  }
  function row(label, value, cls) {
    return '<div class="row ' + (cls || "") + '"><span>' + esc(label) + "</span><span>" + esc(value) + "</span></div>";
  }

  // Paper width
  var paperMm = get("w") === "80" ? 80 : 58;
  if (paperMm === 80) document.body.classList.add("w80");

  // Set the paper to exactly receipt width x receipt length, so the print dialog uses the right format
  function fitPaper() {
    var el = document.getElementById("receipt");
    var hMm = Math.ceil(el.getBoundingClientRect().height * 25.4 / 96) + 6;
    document.getElementById("page-size").textContent =
      "@page { size: " + paperMm + "mm " + Math.max(hMm, 50) + "mm; margin: 0; }";
  }

  var itemsRaw = get("i");
  if (!itemsRaw) {
    document.getElementById("error").textContent = "No receipt data in the link.";
    return;
  }

  // AppSheet joins list items with " , ". Split only where the next chunk starts with "qty|",
  // so commas inside item names don't break the line.
  var lines = itemsRaw.split(/\s*,\s*(?=-?\d+(?:[.,]\d+)?\s*\|)/);

  var h = [];
  // ---- Header: logo + store info, centred ----
  var logo = get("logo");
  if (logo) h.push('<img class="logo" src="' + esc(logo) + '" alt="">');
  var info = [get("s"), get("a"), get("p")].filter(Boolean).map(esc).join("<br>");
  if (info) h.push('<div class="center store">' + info + "</div>");

  // ---- Order number between two lines, then platform / order type / customer ----
  h.push("<hr>");
  if (get("id")) h.push('<div class="center">Order No: ' + esc(get("id")) + "</div>");
  var metaTop = [get("plat"), get("ot")].filter(Boolean).map(esc).join(" · ");
  if (metaTop) h.push('<div class="center meta">' + metaTop + "</div>");
  if (get("t")) h.push('<div class="center meta">' + esc(get("t")) + "</div>");
  h.push("<hr>");

  // ---- Items: name + line total on one row, "qty x price" underneath ----
  var computedSub = 0;
  lines.forEach(function (line) {
    var parts = line.split("|");
    if (parts.length < 3) { if (line.trim()) h.push('<div class="item">' + esc(line) + "</div>"); return; }
    var isNumeric = function (v) { return /^\s*-?[\d.,]+\s*$/.test(v); };
    // v2 lines carry a 4th field (line total incl. add-ons); old lines have 3 fields
    var hasTotal = parts.length >= 4 && isNumeric(parts[parts.length - 1]) && isNumeric(parts[parts.length - 2]);
    var qty = toNum(parts[0]);
    var nameEnd = hasTotal ? parts.length - 2 : parts.length - 1;
    var nameField = parts.slice(1, nameEnd).join("|");
    var price = toNum(parts[nameEnd]);
    var lineTotal = hasTotal ? toNum(parts[parts.length - 1]) : qty * price;
    computedSub += lineTotal;
    var bits = nameField.split("~");
    var name = bits[0].trim();
    var details = bits.slice(1).map(function (d) { return d.trim(); }).filter(Boolean);
    var sub = details.map(function (d) {
      if (d.charAt(0) === "+" && d.indexOf("^") > -1) {
        var k = d.lastIndexOf("^");
        return row(d.slice(0, k).trim(), toNum(d.slice(k + 1)).toLocaleString("id-ID"), "sub");
      }
      return '<div class="item-detail">' + esc(d) + "</div>";
    }).join("");
    h.push('<div class="item">' +
             '<div class="row"><span class="item-name">' + esc(name) + "</span><span>" +
               esc(lineTotal.toLocaleString("id-ID")) + "</span></div>" +
             '<div class="item-detail">' + esc(qty.toLocaleString("id-ID")) + " x " + esc(money(price)) + "</div>" +
             sub +
           "</div>");
  });

  // ---- Note / catatan ----
  if (get("n")) h.push('<div class="note">Catatan: ' + esc(get("n")) + "</div>");

  // ---- Total (only when the link includes tot=) ----
  if (get("tot")) {
    h.push("<hr>");
    h.push(row("TOTAL", money(get("tot")), "bold"));
  }

  // ---- Date at the bottom, then optional footer ----
  if (get("d")) h.push('<div class="center date">' + esc(get("d")) + "</div>");
  if (get("f")) h.push('<div class="center footer">' + esc(get("f")) + "</div>");

  document.getElementById("receipt").innerHTML = h.join("");
  fitPaper();
  window.addEventListener("load", fitPaper);
  window.addEventListener("beforeprint", fitPaper);

  // Auto-print once the page (and logo, if any) has loaded
  if (get("auto") !== "0") {
    var go = function () { setTimeout(function () { fitPaper(); window.print(); }, 400); };
    if (document.readyState === "complete") go(); else window.addEventListener("load", go);
  }
})();
</script>
</body>
</html>
